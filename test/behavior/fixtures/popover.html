<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Popover behavior fixture</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/clanker-ui.css">
  <link rel="stylesheet" href="/test/behavior/fixtures/fixture.css">
  <script type="module" src="/clanker-ui.js"></script>
</head>
<body>
  <main data-behavior="page">
    <div tabindex="0" data-behavior="sentinel">Before the example</div>
    <div data-behavior="stage">
      <div data-behavior="preview">
        <div data-slot="popover">
          <button type="button" data-slot="button" data-variant="outline" data-popover-trigger>Open popover</button>
          <div data-slot="popover-content" data-behavior="w-80">
            <div data-behavior="grid-4">
              <div data-behavior="stack-2">
                <h4 data-behavior="heading">Dimensions</h4>
                <p data-behavior="muted-sm">Set the dimensions for the layer.</p>
              </div>
              <div data-behavior="grid-2">
                <div data-behavior="row-3">
                  <label data-slot="label" for="width">Width</label>
                  <input data-slot="input" id="width" value="100%" data-behavior="col-2">
                </div>
                <div data-behavior="row-3">
                  <label data-slot="label" for="maxWidth">Max. width</label>
                  <input data-slot="input" id="maxWidth" value="300px" data-behavior="col-2">
                </div>
                <div data-behavior="row-3">
                  <label data-slot="label" for="height">Height</label>
                  <input data-slot="input" id="height" value="25px" data-behavior="col-2">
                </div>
                <div data-behavior="row-3">
                  <label data-slot="label" for="maxHeight">Max. height</label>
                  <input data-slot="input" id="maxHeight" value="none" data-behavior="col-2">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div tabindex="0" data-behavior="sentinel">After the example</div>
  </main>
</body>
</html>
