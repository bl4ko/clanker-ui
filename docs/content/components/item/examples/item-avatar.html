<div class="flex w-full max-w-lg flex-col gap-6">
  <div data-slot="item" data-variant="outline">
    <div data-slot="item-media">
      <span data-slot="avatar" class="size-10">
        <img data-slot="avatar-image" src="demo/assets/g3-avatar-3.svg" alt="@evilrabbit">
        <span data-slot="avatar-fallback">ER</span>
      </span>
    </div>
    <div data-slot="item-content">
      <div data-slot="item-title">Evil Rabbit</div>
      <p data-slot="item-description">Last seen 5 months ago</p>
    </div>
    <div data-slot="item-actions">
      <button type="button" data-slot="button" data-size="icon-sm" data-variant="outline" class="rounded-full" aria-label="Invite">
        <svg data-lucide="plus"></svg>
      </button>
    </div>
  </div>
  <div data-slot="item" data-variant="outline">
    <div data-slot="item-media">
      <div class="flex -space-x-2 *:data-[slot=avatar]:ring-2 *:data-[slot=avatar]:ring-background *:data-[slot=avatar]:grayscale">
        <span data-slot="avatar" class="hidden sm:flex">
          <img data-slot="avatar-image" src="demo/assets/g3-avatar-1.svg" alt="@shadcn">
          <span data-slot="avatar-fallback">CN</span>
        </span>
        <span data-slot="avatar" class="hidden sm:flex">
          <img data-slot="avatar-image" src="demo/assets/g3-avatar-2.svg" alt="@maxleiter">
          <span data-slot="avatar-fallback">LR</span>
        </span>
        <span data-slot="avatar">
          <img data-slot="avatar-image" src="demo/assets/g3-avatar-3.svg" alt="@evilrabbit">
          <span data-slot="avatar-fallback">ER</span>
        </span>
      </div>
    </div>
    <div data-slot="item-content">
      <div data-slot="item-title">No Team Members</div>
      <p data-slot="item-description">Invite your team to collaborate on this project.</p>
    </div>
    <div data-slot="item-actions">
      <button type="button" data-slot="button" data-size="sm" data-variant="outline">Invite</button>
    </div>
  </div>
</div>
