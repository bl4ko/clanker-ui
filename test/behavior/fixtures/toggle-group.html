<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Toggle Group behavior fixture</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/clanker-ui.css">
  <link rel="stylesheet" href="/test/behavior/fixtures/fixture.css">
  <script type="module" src="/clanker-ui.js"></script>
</head>
<body>
  <main data-behavior="page">
    <div tabindex="0" data-behavior="sentinel">Before the example</div>
    <div data-behavior="stage">
      <div data-behavior="preview">
        <div data-slot="toggle-group" data-type="multiple" data-variant="outline">
          <button type="button" data-slot="toggle-group-item" data-value="bold" aria-label="Toggle bold"><svg data-lucide="bold"></svg></button>
          <button type="button" data-slot="toggle-group-item" data-value="italic" aria-label="Toggle italic"><svg data-lucide="italic"></svg></button>
          <button type="button" data-slot="toggle-group-item" data-value="strikethrough" aria-label="Toggle strikethrough"><svg data-lucide="underline"></svg></button>
        </div>
      </div>
    </div>
    <div tabindex="0" data-behavior="sentinel">After the example</div>
  </main>
</body>
</html>
