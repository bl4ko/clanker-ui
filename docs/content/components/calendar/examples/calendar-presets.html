<div data-slot="card" data-size="sm" class="mx-auto w-fit max-w-[300px]" data-js="calendar-presets">
  <div data-slot="card-content">
    <div data-slot="calendar" data-fixed-weeks data-week-start="0" class="p-0 [--cell-size:--spacing(9.5)]"></div>
  </div>
  <div data-slot="card-footer" class="flex flex-wrap gap-2 border-t">
    <button type="button" data-slot="button" data-variant="outline" data-size="sm" class="flex-1" data-days="0">Today</button>
    <button type="button" data-slot="button" data-variant="outline" data-size="sm" class="flex-1" data-days="1">Tomorrow</button>
    <button type="button" data-slot="button" data-variant="outline" data-size="sm" class="flex-1" data-days="3">In 3 days</button>
    <button type="button" data-slot="button" data-variant="outline" data-size="sm" class="flex-1" data-days="7">In a week</button>
    <button type="button" data-slot="button" data-variant="outline" data-size="sm" class="flex-1" data-days="14">In 2 weeks</button>
  </div>
</div>
