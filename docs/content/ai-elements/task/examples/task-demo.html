<div class="flex min-h-72 w-full max-w-sm flex-col gap-4 py-6 text-sm" id="task-demo">

    <div data-slot="message-content">
      <div data-slot="bubble" data-align="end" data-variant="muted"><div data-slot="bubble-content">Add Open Graph metadata to the home page.</div></div>
    </div>
  </div>
  <div data-slot="message">
    <div data-slot="message-content" class="gap-4">
      <div data-slot="trace">
        <div data-slot="trace-collapsible">

              <span data-slot="trace-title">Found the project files</span>
            </span>
          </button>
          <div data-slot="trace-collapsible-content">
            <div data-slot="trace">

              <span data-slot="trace-line"><span data-slot="trace-title">Read app/page.tsx</span></span>
            </div>
          </div>
        </div>
        <div data-slot="trace-collapsible">
          <button type="button" data-slot="trace-collapsible-trigger">
            <span data-slot="trace-line">
              <span data-slot="trace-icon"><svg data-lucide="circle-check"></svg></span>
              <span data-slot="trace-title">Updated the page metadata</span>
            </span>
          </button>
          <div data-slot="trace-collapsible-content">
            <div data-slot="trace">
              <span data-slot="trace-line"><span data-slot="trace-title">Edited app/layout.tsx</span></span>
              <span data-slot="trace-line"><span data-slot="trace-title">Edited app/page.tsx</span></span>
            </div>
          </div>
        </div>

      <p>Added Open Graph defaults to app/layout.tsx and a title, description and image for the home page in app/page.tsx.</p>
