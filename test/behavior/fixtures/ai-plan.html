<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Plan behavior fixture</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/clanker-ui.css">
  <link rel="stylesheet" href="/test/behavior/fixtures/fixture.css">
  <script type="module" src="/clanker-ui.js"></script>
</head>
<body>
  <main data-behavior="page">
    <div tabindex="0" data-behavior="sentinel">Before the example</div>
    <div data-behavior="stage">
      <div data-behavior="preview">
        <div data-behavior="col-gap-2 w-full-max-w-sm text-sm">
          <div data-slot="message" data-align="end">
            <div data-slot="message-content">
              <div data-slot="bubble" data-align="end" data-variant="muted"><div data-slot="bubble-content">Migrate the dialog components to Base UI.</div></div>
            </div>
          </div>
          <div data-slot="message">
            <div data-slot="message-content">
              <div data-slot="trace">
                <div data-slot="trace-collapsible" data-default-open>
                  <button type="button" data-slot="trace-collapsible-trigger">
                    <span data-slot="trace-line">
                      <span data-slot="trace-icon"><svg data-lucide="route"></svg></span>
                      <span data-slot="trace-title">Plan: migrate to Base UI</span>
                      <span data-slot="trace-description">4 of 4 done</span>
                    </span>
                  </button>
                  <div data-slot="trace-collapsible-content">
                    <div data-slot="trace">
                      <span data-slot="trace-line">
                        <span data-slot="trace-icon"><svg data-lucide="circle-check"></svg></span>
                        <span data-slot="trace-title">Install @base-ui/react</span>
                      </span>
                      <span data-slot="trace-line">
                        <span data-slot="trace-icon"><svg data-lucide="circle-check"></svg></span>
                        <span data-slot="trace-title">Replace the Radix imports</span>
                      </span>
                      <span data-slot="trace-line">
                        <span data-slot="trace-icon"><svg data-lucide="circle-check"></svg></span>
                        <span data-slot="trace-title">Rename asChild to render</span>
                      </span>
                      <span data-slot="trace-line">
                        <span data-slot="trace-icon"><svg data-lucide="circle-check"></svg></span>
                        <span data-slot="trace-title">Run the type checker</span>
                      </span>
                    </div>
                  </div>
                </div>
              </div>
              <p>Migrated Dialog and AlertDialog. The type checker passes.</p>
            </div>
          </div>
          <button type="button" data-slot="button" data-variant="outline" data-size="sm">Replay</button>
        </div>
      </div>
    </div>
    <div tabindex="0" data-behavior="sentinel">After the example</div>
  </main>
</body>
</html>
