<fieldset data-slot="field-set" class="w-full max-w-xs">
  <div data-slot="field-group">
    <div data-slot="field">
      <label data-slot="field-label" for="username">Username</label>
      <input data-slot="input" id="username" type="text" placeholder="Max Leiter">
      <p data-slot="field-description">Choose a unique username for your account.</p>
    </div>
    <div data-slot="field">
      <label data-slot="field-label" for="password">Password</label>
      <p data-slot="field-description">Must be at least 8 characters long.</p>
      <input data-slot="input" id="password" type="password" placeholder="••••••••">
    </div>
  </div>
</fieldset>
