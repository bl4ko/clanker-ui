<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Carousel behavior fixture</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/clanker-ui.css">
  <link rel="stylesheet" href="/test/behavior/fixtures/fixture.css">
  <script type="module" src="/clanker-ui.js"></script>
</head>
<body>
  <main data-behavior="page">
    <div tabindex="0" data-behavior="sentinel">Before the example</div>
    <div data-behavior="stage">
      <div data-behavior="preview">
        <div data-slot="carousel" data-behavior="carousel-w">
          <div data-slot="carousel-content">
            <div>
              <div data-slot="carousel-item"><div data-behavior="p-1"><div data-slot="card"><div data-slot="card-content" data-behavior="square"><span data-behavior="big">1</span></div></div></div></div>
              <div data-slot="carousel-item"><div data-behavior="p-1"><div data-slot="card"><div data-slot="card-content" data-behavior="square"><span data-behavior="big">2</span></div></div></div></div>
              <div data-slot="carousel-item"><div data-behavior="p-1"><div data-slot="card"><div data-slot="card-content" data-behavior="square"><span data-behavior="big">3</span></div></div></div></div>
              <div data-slot="carousel-item"><div data-behavior="p-1"><div data-slot="card"><div data-slot="card-content" data-behavior="square"><span data-behavior="big">4</span></div></div></div></div>
              <div data-slot="carousel-item"><div data-behavior="p-1"><div data-slot="card"><div data-slot="card-content" data-behavior="square"><span data-behavior="big">5</span></div></div></div></div>
            </div>
          </div>
          <button data-slot="carousel-previous"></button>
          <button data-slot="carousel-next"></button>
        </div>
      </div>
    </div>
    <div tabindex="0" data-behavior="sentinel">After the example</div>
  </main>
</body>
</html>
