<div class="grid w-full max-w-sm gap-6">
  <div data-slot="input-group">
    <div data-slot="input-group-addon"><span data-slot="input-group-text">$</span></div>
    <input data-slot="input-group-control" placeholder="0.00" aria-label="Amount">
    <div data-slot="input-group-addon" data-align="inline-end"><span data-slot="input-group-text">USD</span></div>
  </div>
  <div data-slot="input-group">
    <div data-slot="input-group-addon"><span data-slot="input-group-text">https://</span></div>
    <input data-slot="input-group-control" placeholder="example.com" class="pl-0.5!" aria-label="Website">
    <div data-slot="input-group-addon" data-align="inline-end"><span data-slot="input-group-text">.com</span></div>
  </div>
  <div data-slot="input-group">
    <input data-slot="input-group-control" placeholder="Enter your username" aria-label="Username">
    <div data-slot="input-group-addon" data-align="inline-end"><span data-slot="input-group-text">@company.com</span></div>
  </div>
  <div data-slot="input-group">
    <textarea data-slot="input-group-control" placeholder="Enter your message" aria-label="Message"></textarea>
    <div data-slot="input-group-addon" data-align="block-end"><span data-slot="input-group-text" class="text-xs text-muted-foreground">120 characters left</span></div>
  </div>
</div>
