<div data-slot="field-group" class="max-w-sm" dir="rtl" lang="ar">
  <div data-slot="field" data-orientation="horizontal">
    <button type="button" data-slot="checkbox" id="terms-checkbox-rtl" data-name="terms-checkbox-rtl"></button>
    <label data-slot="label" for="terms-checkbox-rtl">قبول الشروط والأحكام</label>
  </div>
  <div data-slot="field" data-orientation="horizontal">
    <button type="button" data-slot="checkbox" id="terms-checkbox-2-rtl" data-name="terms-checkbox-2-rtl" data-checked></button>
    <div data-slot="field-content">
      <label data-slot="field-label" for="terms-checkbox-2-rtl">قبول الشروط والأحكام</label>
      <p data-slot="field-description">بالنقر على هذا المربع، فإنك توافق على الشروط.</p>
    </div>
  </div>
  <div data-slot="field" data-orientation="horizontal" data-disabled="true">
    <button type="button" data-slot="checkbox" id="toggle-checkbox-rtl" data-name="toggle-checkbox-rtl" disabled></button>
    <label data-slot="field-label" for="toggle-checkbox-rtl">تفعيل الإشعارات</label>
  </div>
  <label data-slot="field-label">
    <div data-slot="field" data-orientation="horizontal">
      <button type="button" data-slot="checkbox" id="toggle-checkbox-2-rtl" data-name="toggle-checkbox-2-rtl"></button>
      <div data-slot="field-content">
        <div data-slot="field-label">تفعيل الإشعارات</div>
        <p data-slot="field-description">يمكنك تفعيل أو إلغاء تفعيل الإشعارات في أي وقت.</p>
      </div>
    </div>
  </label>
</div>
