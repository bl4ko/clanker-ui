<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Dialog behavior fixture</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/clanker-ui.css">
  <link rel="stylesheet" href="/test/behavior/fixtures/fixture.css">
  <script type="module" src="/clanker-ui.js"></script>
</head>
<body>
  <main data-behavior="page">
    <div tabindex="0" data-behavior="sentinel">Before the example</div>
    <div data-behavior="stage">
      <div data-behavior="preview">
        <div data-slot="dialog">
          <button type="button" data-slot="button" data-variant="outline" data-dialog-trigger>Open Dialog</button>
          <dialog data-slot="dialog-content" data-behavior="max-w-sm">
            <div data-slot="dialog-header">
              <h2 data-slot="dialog-title">Edit profile</h2>
              <p data-slot="dialog-description">Make changes to your profile here. Click save when you're done.</p>
            </div>
            <div data-slot="field-group">
              <div data-slot="field" role="group">
                <label data-slot="label" for="name-1">Name</label>
                <input data-slot="input" id="name-1" name="name" value="Pedro Duarte">
              </div>
              <div data-slot="field" role="group">
                <label data-slot="label" for="username-1">Username</label>
                <input data-slot="input" id="username-1" name="username" value="@peduarte">
              </div>
            </div>
            <div data-slot="dialog-footer">
              <button type="button" data-slot="button" data-variant="outline" data-dialog-close>Cancel</button>
              <button type="submit" data-slot="button">Save changes</button>
            </div>
          </dialog>
        </div>
      </div>
    </div>
    <div tabindex="0" data-behavior="sentinel">After the example</div>
  </main>
</body>
</html>
