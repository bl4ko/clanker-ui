<div data-slot="field-group" class="max-w-xs">
  <div data-slot="field">
    <label data-slot="field-label" for="fieldgroup-name">Name</label>
    <input data-slot="input" id="fieldgroup-name" placeholder="Jordan Lee">
  </div>
  <div data-slot="field">
    <label data-slot="field-label" for="fieldgroup-email">Email</label>
    <input data-slot="input" id="fieldgroup-email" type="email" placeholder="name@example.com">
    <p data-slot="field-description">We&#39;ll send updates to this address.</p>
  </div>
  <div data-slot="field" data-orientation="horizontal">
    <button data-slot="button" type="reset" data-variant="outline">Reset</button>
    <button type="submit" data-slot="button">Submit</button>
  </div>
</div>
