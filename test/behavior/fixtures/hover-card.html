<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Hover Card behavior fixture</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/clanker-ui.css">
  <link rel="stylesheet" href="/test/behavior/fixtures/fixture.css">
  <script type="module" src="/clanker-ui.js"></script>
</head>
<body>
  <main data-behavior="page">
    <div tabindex="0" data-behavior="sentinel">Before the example</div>
    <div data-behavior="stage">
      <div data-behavior="preview">
        <div data-slot="hover-card" data-open-delay="10" data-close-delay="100">
          <button type="button" data-slot="button" data-variant="link" data-hover-card-trigger>Hover Here</button>
          <div data-slot="hover-card-content" data-behavior="w-64 col-gap-0-5">
            <div data-behavior="semibold">@nextjs</div>
            <div>The React Framework – created and maintained by @vercel.</div>
            <div data-behavior="muted-xs">Joined December 2021</div>
          </div>
        </div>
      </div>
    </div>
    <div tabindex="0" data-behavior="sentinel">After the example</div>
  </main>
</body>
</html>
