<div data-slot="field" class="w-full max-w-xs">
  <label data-slot="field-label">Department</label>
  <div data-slot="select">
    <button type="button" data-slot="select-trigger"><span data-slot="select-value">Choose department</span></button>
    <div data-slot="select-content">
      <div data-slot="select-group">
        <div data-slot="select-item" data-value="engineering">Engineering</div>
        <div data-slot="select-item" data-value="design">Design</div>
        <div data-slot="select-item" data-value="marketing">Marketing</div>
        <div data-slot="select-item" data-value="sales">Sales</div>
        <div data-slot="select-item" data-value="support">Customer Support</div>
        <div data-slot="select-item" data-value="hr">Human Resources</div>
        <div data-slot="select-item" data-value="finance">Finance</div>
        <div data-slot="select-item" data-value="operations">Operations</div>
      </div>
    </div>
  </div>
  <p data-slot="field-description">Select your department or area of work.</p>
</div>
