name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=pypi depName=playwright
  PLAYWRIGHT_VERSION: "1.64.1"

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      browser: ${{ steps.plan.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/ci
            test
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          files="$RUNNER_TEMP/files"
          : > "$files"
          if [ "$EVENT" = pull_request ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$files"
          fi
          python3 -I tools/ci/plan.py "$files"

  go:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      TAILWIND_VERSION: "4.3.3"
      TAILWIND_SHA256: dc61b3ac6b8c9ca874c0cc4c57b2409791a64c5540404ca5f5367360babc313a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Tailwind CLI
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSLo "$bin/tailwindcss" "https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWIND_VERSION}/tailwindcss-linux-x64"
          echo "$TAILWIND_SHA256  $bin/tailwindcss" | sha256sum -c -
          chmod +x "$bin/tailwindcss"
          echo "$bin" >> "$GITHUB_PATH"
      - run: go vet ./... && go test ./...
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.13"
          enable-cache: false
      - name: Tool self-tests
        run: |
          uv run --no-project --with "playwright==$PLAYWRIGHT_VERSION" python -I tools/parity/selftest.py
          uv run --no-project --with "playwright==$PLAYWRIGHT_VERSION" python -I test/run.py --self-test
          python3 -I tools/ci/plan.py --self-test
      - name: Generated CSS is current
        env:
          NO_COLOR: "1"
        run: |
          go run ./tools/gen fetch -src "$RUNNER_TEMP/shadcn"
          go run ./tools/gen -src "$RUNNER_TEMP/shadcn" -out clanker-ui.css
          git diff --exit-code clanker-ui.css
          go run ./tools/gen docs-coverage -src "$RUNNER_TEMP/shadcn"

  gitleaks:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history
        env:
          # renovate: datasource=docker depName=ghcr.io/gitleaks/gitleaks
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" git --no-banner --redact --exit-code 1 .

  browser:
    name: ${{ matrix.engine }} ${{ matrix.id }}
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: ${{ matrix.engine == 'webkit' && 'macos-26' || 'ubuntu-26.04' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      ENGINE: ${{ matrix.engine }}
      ONLY: ${{ matrix.only }}
      K: ${{ matrix.k }}
      THEMES: ${{ matrix.themes || 'light,dark' }}
      MODE: ${{ matrix.mode }}
      KIT: ${{ matrix.kit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.13"
          enable-cache: false
      - name: Install browser
        run: uv run --no-project --with "playwright==$PLAYWRIGHT_VERSION" playwright install --with-deps "$ENGINE"
      - name: Start server
        if: matrix.only
        run: |
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          go build -o "$RUNNER_TEMP/srv" .
          "$RUNNER_TEMP/srv" -addr 127.0.0.1:8110 -dir "$GITHUB_WORKSPACE" ${KIT:+-kit "$KIT"} > "$OUT/srv.log" 2>&1 &
          for _ in $(seq 60); do
            curl -fsS -o /dev/null http://127.0.0.1:8110/healthz && exit 0
            sleep 1
          done
          exit 1
      - name: Run checks
        if: matrix.only
        env:
          EXITFIRST: ${{ github.event_name == 'pull_request' }}
        run: |
          set +e
          OUT="$RUNNER_TEMP/out"
          py=(uv run --no-project --with "playwright==$PLAYWRIGHT_VERSION" python -I -u test/run.py --base-url http://127.0.0.1:8110 --engines "$ENGINE" --only "$ONLY" --themes "$THEMES" --retry)
          if [ -n "$MODE" ]; then py+=("--$MODE"); fi
          if [ "$EXITFIRST" = true ]; then py+=(--exitfirst); fi
          "${py[@]}" ${K:+-k "$K"} --out "$OUT/run" 2>&1 | tee "$OUT/run.log"
          code=${PIPESTATUS[0]}
          sed -nE 's/^flaky (\[[^]]+\] [a-z0-9_]+\.[a-z0-9_]+).*/- Passed on retry: \1/p' "$OUT/run.log" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Check exported pages
        if: matrix.pages && !cancelled()
        run: |
          OUT="$RUNNER_TEMP/out"
          ROOT="$RUNNER_TEMP/pages"
          mkdir -p "$OUT" "$ROOT"
          go run . -export "$ROOT/clanker-ui" -base /clanker-ui -site-url http://127.0.0.1:8120/clanker-ui/
          uv run --no-project python -I -m http.server 8120 --bind 127.0.0.1 --directory "$ROOT" > "$OUT/http.log" 2>&1 &
          for _ in $(seq 60); do
            curl -fsS -o /dev/null http://127.0.0.1:8120/clanker-ui/ && break
            sleep 1
          done
          uv run --no-project --with "playwright==$PLAYWRIGHT_VERSION" python -I -u test/run.py --base-url http://127.0.0.1:8120/clanker-ui --engines "$ENGINE" --only pages --themes "$THEMES" --out "$OUT/pages" 2>&1 | tee "$OUT/pages.log"
          exit "${PIPESTATUS[0]}"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: out-${{ matrix.engine }}-${{ matrix.id }}
          path: ${{ runner.temp }}/out
          retention-days: 14

  ci-result:
    name: ci-result
    if: always()
    needs: [plan, go, gitleaks, browser]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || [ "$r" = skipped ] || exit 1
          done
