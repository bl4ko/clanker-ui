<fieldset data-slot="field-set" class="w-full max-w-xs">
  <div data-slot="field-group">
    <div data-slot="field">
      <label data-slot="field-label" for="feedback">Feedback</label>
      <textarea data-slot="textarea" id="feedback" placeholder="Your feedback helps us improve..." rows="4"></textarea>
      <p data-slot="field-description">Share your thoughts about our service.</p>
    </div>
  </div>
</fieldset>
