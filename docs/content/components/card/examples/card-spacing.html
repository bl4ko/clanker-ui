<div class="mx-auto grid w-full max-w-sm gap-4" data-js="card-spacing">
  <div data-slot="toggle-group" data-type="single" data-variant="outline" data-size="sm" data-value="4" data-required class="justify-center" aria-label="Card spacing">
    <button type="button" data-slot="toggle-group-item" data-value="4">16px</button>
    <button type="button" data-slot="toggle-group-item" data-value="5">20px</button>
    <button type="button" data-slot="toggle-group-item" data-value="6">24px</button>
    <button type="button" data-slot="toggle-group-item" data-value="8">32px</button>
  </div>
  <div data-slot="card" class="[--card-spacing:--spacing(4)]">
    <div data-slot="card-header">
      <div data-slot="card-title">Login to your account</div>
      <div data-slot="card-description">Enter your email below to login to your account</div>
      <div data-slot="card-action">
        <button type="button" data-slot="button" data-variant="link">Sign Up</button>
      </div>
    </div>
    <div data-slot="card-content">
      <form>
        <div class="flex flex-col gap-6">
          <div class="grid gap-2">
            <label data-slot="label" for="email-spacing">Email</label>
            <input data-slot="input" id="email-spacing" type="email" placeholder="m@example.com" required>
          </div>
          <div class="grid gap-2">
            <div class="flex items-center">
              <label data-slot="label" for="password-spacing">Password</label>
              <a href="#" class="ml-auto inline-block text-sm underline-offset-4 hover:underline">Forgot your password?</a>
            </div>
            <input data-slot="input" id="password-spacing" type="password" required>
          </div>
        </div>
      </form>
    </div>
    <div data-slot="card-footer" class="flex-col gap-2">
      <button type="submit" data-slot="button" class="w-full">Login</button>
      <button type="button" data-slot="button" data-variant="outline" class="w-full">Login with Google</button>
    </div>
  </div>
</div>
