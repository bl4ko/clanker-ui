<div data-slot="field-group" class="w-full max-w-xs">
  <fieldset data-slot="field-set">
    <legend data-slot="field-legend" data-variant="label">Show these items on the desktop</legend>
    <p data-slot="field-description">Select the items you want to show on the desktop.</p>
    <div data-slot="field-group" class="gap-3">
      <div data-slot="field" data-orientation="horizontal">
        <button type="button" data-slot="checkbox" id="finder-pref-9k2-hard-disks-ljj"></button>
        <label data-slot="field-label" for="finder-pref-9k2-hard-disks-ljj" class="font-normal">Hard disks</label>
      </div>
      <div data-slot="field" data-orientation="horizontal">
        <button type="button" data-slot="checkbox" id="finder-pref-9k2-external-disks-1yg"></button>
        <label data-slot="field-label" for="finder-pref-9k2-external-disks-1yg" class="font-normal">External disks</label>
      </div>
      <div data-slot="field" data-orientation="horizontal">
        <button type="button" data-slot="checkbox" id="finder-pref-9k2-cds-dvds-fzt"></button>
        <label data-slot="field-label" for="finder-pref-9k2-cds-dvds-fzt" class="font-normal">CDs, DVDs, and iPods</label>
      </div>
      <div data-slot="field" data-orientation="horizontal">
        <button type="button" data-slot="checkbox" id="finder-pref-9k2-connected-servers-6l2"></button>
        <label data-slot="field-label" for="finder-pref-9k2-connected-servers-6l2" class="font-normal">Connected servers</label>
      </div>
    </div>
  </fieldset>
  <div data-slot="field-separator"></div>
  <div data-slot="field" data-orientation="horizontal">
    <button type="button" data-slot="checkbox" id="finder-pref-9k2-sync-folders-nep" data-checked></button>
    <div data-slot="field-content">
      <label data-slot="field-label" for="finder-pref-9k2-sync-folders-nep">Sync Desktop &amp; Documents folders</label>
      <p data-slot="field-description">Your Desktop &amp; Documents folders are being synced with iCloud Drive. You can access them from other devices.</p>
    </div>
  </div>
</div>
