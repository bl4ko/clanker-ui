<body>
  <main data-slot="page">
    <div data-slot="page-header">
      <h1 data-slot="page-title">Profile</h1>
      <p data-slot="page-description" class="flex gap-4 text-sm">Your name as others see it.</p>
    </div>
    <div data-slot="card">
      <form data-slot="form" id="profile-form">
        <div data-slot="card-content">

          </div>
        </div>
        <div data-slot="card-footer">
          <button type="submit" data-slot="button">Save</button>
          <button type="button" data-slot="button" data-variant="outline" data-size="icon" data-dialog-trigger="help"><svg data-lucide="circle-help"></svg></button>
          <button type="button" data-slot="button">Cancel</button>
        </div>
      </form>
    </div>
  </main>
  <div data-slot="dialog" id="help">
    <dialog data-slot="dialog-content">
      <div data-slot="dialog-header">
        <h2 data-slot="dialog-title">Help</h2>
