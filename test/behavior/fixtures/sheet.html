<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sheet behavior fixture</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/clanker-ui.css">
  <link rel="stylesheet" href="/test/behavior/fixtures/fixture.css">
  <script type="module" src="/clanker-ui.js"></script>
</head>
<body>
  <main data-behavior="page">
    <div tabindex="0" data-behavior="sentinel">Before the example</div>
    <div data-behavior="stage">
      <div data-behavior="preview">
        <div data-slot="sheet">
          <button type="button" data-slot="button" data-variant="outline" data-sheet-trigger>Open</button>
          <dialog data-slot="sheet-content">
            <div data-slot="sheet-header">
              <h2 data-slot="sheet-title">Edit profile</h2>
              <p data-slot="sheet-description">Make changes to your profile here. Click save when you're done.</p>
            </div>
            <div data-behavior="sheet-fields">
              <div data-behavior="grid-3">
                <label data-slot="label" for="sheet-demo-name">Name</label>
                <input data-slot="input" id="sheet-demo-name" value="Pedro Duarte">
              </div>
              <div data-behavior="grid-3">
                <label data-slot="label" for="sheet-demo-username">Username</label>
                <input data-slot="input" id="sheet-demo-username" value="@peduarte">
              </div>
            </div>
            <div data-slot="sheet-footer">
              <button type="submit" data-slot="button">Save changes</button>
              <button type="button" data-slot="button" data-variant="outline" data-sheet-close>Close</button>
            </div>
          </dialog>
        </div>
      </div>
    </div>
    <div tabindex="0" data-behavior="sentinel">After the example</div>
  </main>
</body>
</html>
