<div data-slot="field" class="w-full max-w-xs" data-js="price-field">
  <div data-slot="field-label">Price Range</div>
  <p data-slot="field-description">Set your budget range ($<span class="font-medium tabular-nums" data-js="min">200</span> - <span class="font-medium tabular-nums" data-js="max">800</span>).</p>
  <div data-slot="slider" class="mt-2 w-full" data-js="price">
    <input type="range" min="0" max="1000" step="10" value="200" aria-label="Minimum price">
    <input type="range" min="0" max="1000" step="10" value="800" aria-label="Maximum price">
  </div>
</div>
