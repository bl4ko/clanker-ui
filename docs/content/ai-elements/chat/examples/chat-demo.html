<div class="preview-flush theme-blue relative flex w-full flex-col gap-4" id="chat-demo">
  <div class="flex h-200 w-full flex-col gap-4">
    <div class="flex items-start justify-between gap-4 p-8 pb-4">
      <div class="flex flex-col gap-1">
        <div class="font-medium">New Thread</div>
        <div class="text-sm text-muted-foreground">Ask the agent to change your code.</div>
      </div>
      <div data-slot="tooltip">
        <button type="button" data-slot="button" data-variant="outline" data-size="icon" data-tooltip-trigger aria-label="Reset conversation" id="chat-demo-reset"><svg data-lucide="rotate-cw"></svg></button>
        <div data-slot="tooltip-content">Reset</div>
      </div>
    </div>
    <div class="min-h-0 flex-1">
      <div data-slot="empty" class="h-full" id="chat-demo-empty">
        <div data-slot="empty-header">
          <div data-slot="empty-icon" data-variant="icon"><svg data-lucide="message-circle-dashed"></svg></div>
          <div data-slot="empty-title">What should we build?</div>
          <div data-slot="empty-description">The agent can read your code, run commands and make changes. Press send to start.</div>
        </div>
      </div>
      <div data-slot="message-scroller" id="chat-demo-scroller" hidden>
        <div data-slot="message-scroller-viewport">
          <div data-slot="message-scroller-content" class="gap-6 px-8" aria-busy="false" id="chat-demo-thread"></div>
        </div>
        <button type="button" data-slot="message-scroller-button"></button>
      </div>
    </div>
    <div class="p-8 pt-0">
      <form class="w-full" id="chat-demo-form">
        <div data-slot="input-group">
          <textarea data-slot="input-group-control" class="min-h-14" placeholder="Ask the agent..." aria-label="Message" id="chat-demo-text">Add a dark mode toggle to the settings page.</textarea>
          <div data-slot="input-group-addon" data-align="block-end" class="pt-1">
            <div data-slot="dropdown-menu">
              <button type="button" data-slot="button" data-input-group-button data-variant="outline" data-size="icon-sm" data-dropdown-menu-trigger aria-label="Add context"><svg data-lucide="plus"></svg></button>
              <div data-slot="dropdown-menu-content" data-side="top" data-align="start" class="w-44">
                <div data-slot="dropdown-menu-item"><svg data-lucide="paperclip"></svg>Add Photos &amp; Files</div>
                <div data-slot="dropdown-menu-separator"></div>
                <div data-slot="dropdown-menu-item"><svg data-lucide="telescope"></svg>Deep Research</div>
                <div data-slot="dropdown-menu-item"><svg data-lucide="globe"></svg>Web Search</div>
              </div>
            </div>
            <button type="submit" data-slot="button" data-input-group-button data-variant="default" data-size="icon-sm" class="ms-auto" id="chat-demo-send"><svg data-lucide="arrow-up"></svg><span class="sr-only">Send</span></button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
