<div class="w-full max-w-md py-6" dir="rtl" lang="ar">
  <form>
    <div data-slot="field-group">
      <fieldset data-slot="field-set">
        <legend data-slot="field-legend">طريقة الدفع</legend>
        <p data-slot="field-description">جميع المعاملات آمنة ومشفرة</p>
        <div data-slot="field-group">
          <div data-slot="field">
            <label data-slot="field-label" for="checkout-7j9-card-name-43j-rtl">الاسم على البطاقة</label>
            <input data-slot="input" id="checkout-7j9-card-name-43j-rtl" placeholder="Evil Rabbit" required>
          </div>
          <div data-slot="field">
            <label data-slot="field-label" for="checkout-7j9-card-number-uw1-rtl">رقم البطاقة</label>
            <input data-slot="input" id="checkout-7j9-card-number-uw1-rtl" placeholder="1234 5678 9012 3456" required>
            <p data-slot="field-description">أدخل رقم البطاقة المكون من 16 رقمًا</p>
          </div>
          <div class="grid grid-cols-3 gap-4">
            <div data-slot="field">
              <label data-slot="field-label" for="checkout-exp-month-ts6-rtl">الشهر</label>
              <div data-slot="select">
                <button type="button" data-slot="select-trigger" id="checkout-exp-month-ts6-rtl"><span data-slot="select-value">ش.ش</span></button>
                <div data-slot="select-content">
                  <div data-slot="select-group">
                    <div data-slot="select-item" data-value="01">٠١</div>
                    <div data-slot="select-item" data-value="02">٠٢</div>
                    <div data-slot="select-item" data-value="03">٠٣</div>
                    <div data-slot="select-item" data-value="04">٠٤</div>
                    <div data-slot="select-item" data-value="05">٠٥</div>
                    <div data-slot="select-item" data-value="06">٠٦</div>
                    <div data-slot="select-item" data-value="07">٠٧</div>
                    <div data-slot="select-item" data-value="08">٠٨</div>
                    <div data-slot="select-item" data-value="09">٠٩</div>
                    <div data-slot="select-item" data-value="10">١٠</div>
                    <div data-slot="select-item" data-value="11">١١</div>
                    <div data-slot="select-item" data-value="12">١٢</div>
                  </div>
                </div>
              </div>
            </div>
            <div data-slot="field">
              <label data-slot="field-label" for="checkout-7j9-exp-year-f59-rtl">السنة</label>
              <div data-slot="select">
                <button type="button" data-slot="select-trigger" id="checkout-7j9-exp-year-f59-rtl"><span data-slot="select-value">YYYY</span></button>
                <div data-slot="select-content">
                  <div data-slot="select-group">
                    <div data-slot="select-item" data-value="2024">2024</div>
                    <div data-slot="select-item" data-value="2025">2025</div>
                    <div data-slot="select-item" data-value="2026">2026</div>
                    <div data-slot="select-item" data-value="2027">2027</div>
                    <div data-slot="select-item" data-value="2028">2028</div>
                    <div data-slot="select-item" data-value="2029">2029</div>
                  </div>
                </div>
              </div>
            </div>
            <div data-slot="field">
              <label data-slot="field-label" for="checkout-7j9-cvv-rtl">CVV</label>
              <input data-slot="input" id="checkout-7j9-cvv-rtl" placeholder="123" required>
            </div>
          </div>
        </div>
      </fieldset>
      <div data-slot="field-separator"></div>
      <fieldset data-slot="field-set">
        <legend data-slot="field-legend">عنوان الفوترة</legend>
        <p data-slot="field-description">عنوان الفوترة المرتبط بطريقة الدفع الخاصة بك</p>
        <div data-slot="field-group">
          <div data-slot="field" data-orientation="horizontal">
            <button type="button" data-slot="checkbox" id="checkout-7j9-same-as-shipping-wgm-rtl" data-checked></button>
            <label data-slot="field-label" for="checkout-7j9-same-as-shipping-wgm-rtl" class="font-normal">نفس عنوان الشحن</label>
          </div>
        </div>
      </fieldset>
      <fieldset data-slot="field-set">
        <div data-slot="field-group">
          <div data-slot="field">
            <label data-slot="field-label" for="checkout-7j9-optional-comments-rtl">تعليقات</label>
            <textarea data-slot="textarea" id="checkout-7j9-optional-comments-rtl" placeholder="أضف أي تعليقات إضافية" class="resize-none"></textarea>
          </div>
        </div>
      </fieldset>
      <div data-slot="field" data-orientation="horizontal">
        <button type="submit" data-slot="button">إرسال</button>
        <button type="button" data-slot="button" data-variant="outline">إلغاء</button>
      </div>
    </div>
  </form>
</div>
