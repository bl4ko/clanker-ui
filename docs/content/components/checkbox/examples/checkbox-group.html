<fieldset data-slot="field-set">
  <legend data-slot="field-legend" data-variant="label">Show these items on the desktop:</legend>
  <p data-slot="field-description">Select the items you want to show on the desktop.</p>
  <div data-slot="field-group" class="gap-3">
    <div data-slot="field" data-orientation="horizontal">
      <button type="button" data-slot="checkbox" id="finder-pref-hard-disks" data-name="finder-pref-hard-disks" data-checked></button>
      <label data-slot="field-label" for="finder-pref-hard-disks" class="font-normal">Hard disks</label>
    </div>
    <div data-slot="field" data-orientation="horizontal">
      <button type="button" data-slot="checkbox" id="finder-pref-external-disks" data-name="finder-pref-external-disks" data-checked></button>
      <label data-slot="field-label" for="finder-pref-external-disks" class="font-normal">External disks</label>
    </div>
    <div data-slot="field" data-orientation="horizontal">
      <button type="button" data-slot="checkbox" id="finder-pref-cds-dvds" data-name="finder-pref-cds-dvds"></button>
      <label data-slot="field-label" for="finder-pref-cds-dvds" class="font-normal">CDs, DVDs, and iPods</label>
    </div>
    <div data-slot="field" data-orientation="horizontal">
      <button type="button" data-slot="checkbox" id="finder-pref-connected-servers" data-name="finder-pref-connected-servers"></button>
      <label data-slot="field-label" for="finder-pref-connected-servers" class="font-normal">Connected servers</label>
    </div>
  </div>
</fieldset>
