<html lang="en">
<head>

  <title>Switch behavior fixture</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/clanker-ui.css">

<body>
  <main data-behavior="page">
    <div tabindex="0" data-behavior="sentinel">Before the example</div>
    <div data-behavior="stage">
      <div data-behavior="preview">
        <div data-behavior="row-gap-2">
          <button type="button" data-slot="switch" id="airplane-mode"></button>
          <label data-slot="label" for="airplane-mode">Airplane Mode</label>
        </div>
      </div>
    </div>
    <div tabindex="0" data-behavior="sentinel">After the example</div>
  </main>
