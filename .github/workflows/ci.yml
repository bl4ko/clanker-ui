name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=pypi depName=playwright
  PLAYWRIGHT_VERSION: "1.64.1"

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAILWIND_VERSION: "4.3.3"
      TAILWIND_SHA256: dc61b3ac6b8c9ca874c0cc4c57b2409791a64c5540404ca5f5367360babc313a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Tailwind CLI
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSLo "$bin/tailwindcss" "https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWIND_VERSION}/tailwindcss-linux-x64"
          echo "$TAILWIND_SHA256  $bin/tailwindcss" | sha256sum -c -
          chmod +x "$bin/tailwindcss"
          echo "$bin" >> "$GITHUB_PATH"
      - run: go vet ./... && go test ./...
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.13"
          enable-cache: false
      - name: Parity self-test
        run: uv run --no-project --with "playwright==$PLAYWRIGHT_VERSION" python -I tools/parity/selftest.py

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history
        env:
          # renovate: datasource=docker depName=ghcr.io/gitleaks/gitleaks
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" git --no-banner --redact --exit-code 1 .

  browser:
    name: ${{ matrix.engine }} ${{ matrix.id }}
    runs-on: ${{ matrix.engine == 'webkit' && 'macos-26' || 'ubuntu-24.04' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: chromium, id: behavior, only: behavior, themes: light }
          - { engine: chromium, id: foundation, only: foundation }
          - { engine: chromium, id: g1-docs, only: "g1,docs" }
          - { engine: chromium, id: g2a-split, only: "g2,split", k: '^(g2\.[a-d]|split\.)' }
          - { engine: chromium, id: g2b-g5, only: "g2,g5", k: '^(g2\.[e-n]|g5\.)' }
          - { engine: chromium, id: g2c, only: g2, k: '^g2\.[o-s]' }
          - { engine: chromium, id: g2d-g4a, only: "g2,g4", k: '^(g2\.[t-z]|g4\.[a-c])' }
          - { engine: chromium, id: g3a-spike, only: "g3,spike", k: '^(g3\.[a-c]|spike\.)' }
          - { engine: chromium, id: g3b-pages, only: g3, k: '^g3\.[d-z]', pages: true }
          - { engine: chromium, id: g4b, only: g4, k: '^g4\.[d-z]' }
          - { engine: firefox, id: behavior-a-g1-light, only: "behavior,g1", k: '^(behavior\.[a-l]|g1\.)', themes: light }
          - { engine: firefox, id: behavior-b-g4-light, only: "behavior,g4", k: '^(behavior\.[m-z]|g4\.)', themes: light }
          - { engine: firefox, id: g1-g4-dark, only: "g1,g4", themes: dark }
          - { engine: firefox, id: foundation, only: foundation }
          - { engine: firefox, id: g3, only: g3 }
          - { engine: firefox, id: g2a-split, only: "g2,split", k: '^(g2\.d|split\.)' }
          - { engine: firefox, id: g2b, only: g2, k: '^g2\.[a-ce-n]' }
          - { engine: firefox, id: g2c-spike-docs, only: "g2,spike,docs", k: '^(g2\.[o-s]|spike\.|docs\.)' }
          - { engine: firefox, id: g2d-g5, only: "g2,g5", k: '^(g2\.[t-z]|g5\.)' }
          - { engine: webkit, id: behavior-docs-spike-split-pages-light, only: "behavior,docs,spike,split", themes: light, pages: true }
          - { engine: webkit, id: foundation-g2a-light, only: "foundation,g2", k: '^(foundation\.|g2\.[a-d])', themes: light }
          - { engine: webkit, id: g2b-g3-light, only: "g2,g3", k: '^(g2\.[e-o]|g3\.)', themes: light }
          - { engine: webkit, id: g4-g5-light, only: "g4,g5", themes: light }
          - { engine: webkit, id: g1-g2c-light, only: "g1,g2", k: '^(g1\.|g2\.[p-z])', themes: light }
          - { engine: chromium, id: min-smoke, only: "foundation,split,g5,g1,g2,g3,g4", k: '^(foundation\.|split\.|g5\.|g1\.select$|g2\.dialog$|g3\.carousel$|g4\.calendar$)', themes: light, kit: min }
    env:
      ENGINE: ${{ matrix.engine }}
      ONLY: ${{ matrix.only }}
      K: ${{ matrix.k }}
      THEMES: ${{ matrix.themes || 'light,dark' }}
      KIT: ${{ matrix.kit }}
    steps: &browser-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.13"
          enable-cache: false
      - name: Install browser
        run: uv run --no-project --with "playwright==$PLAYWRIGHT_VERSION" playwright install --with-deps "$ENGINE"
      - name: Start server
        run: |
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          go build -o "$RUNNER_TEMP/srv" .
          "$RUNNER_TEMP/srv" -addr 127.0.0.1:8110 -dir "$GITHUB_WORKSPACE" ${KIT:+-kit "$KIT"} > "$OUT/srv.log" 2>&1 &
          for _ in $(seq 60); do
            curl -fsS -o /dev/null http://127.0.0.1:8110/healthz && exit 0
            sleep 1
          done
          exit 1
      - name: Run checks
        run: |
          set +e
          OUT="$RUNNER_TEMP/out"
          py=(uv run --no-project --with "playwright==$PLAYWRIGHT_VERSION" python -I -u test/run.py --base-url http://127.0.0.1:8110 --engines "$ENGINE" --only "$ONLY" --themes "$THEMES")
          if [ -n "$MODE" ]; then py+=("--$MODE"); fi
          "${py[@]}" ${K:+-k "$K"} --out "$OUT/run" 2>&1 | tee "$OUT/run.log"
          code=${PIPESTATUS[0]}
          [ "$code" -eq 0 ] && exit 0
          failed=$(sed -nE 's/^FAIL \[[^]]+\] ([a-z0-9_]+\.[a-z0-9_]+)$/\1/p' "$OUT/run.log" | sort -u | paste -sd'|' -)
          [ -n "$failed" ] || exit "$code"
          echo "::warning::rerun of failed checks: $failed"
          "${py[@]}" -k "^($failed)$" --out "$OUT/rerun" 2>&1 | tee "$OUT/rerun.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then
            echo "::warning::rerun passed: $failed"
            echo "Passed on rerun: \`${failed//|/\`, \`}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
      - name: Check exported pages
        if: matrix.pages && !cancelled()
        run: |
          OUT="$RUNNER_TEMP/out"
          ROOT="$RUNNER_TEMP/pages"
          mkdir -p "$OUT" "$ROOT"
          go run . -export "$ROOT/clanker-ui" -base /clanker-ui -site-url http://127.0.0.1:8120/clanker-ui/
          uv run --no-project python -I -m http.server 8120 --bind 127.0.0.1 --directory "$ROOT" > "$OUT/http.log" 2>&1 &
          for _ in $(seq 60); do
            curl -fsS -o /dev/null http://127.0.0.1:8120/clanker-ui/ && break
            sleep 1
          done
          uv run --no-project --with "playwright==$PLAYWRIGHT_VERSION" python -I -u test/run.py --base-url http://127.0.0.1:8120/clanker-ui --engines "$ENGINE" --only pages --themes "$THEMES" --out "$OUT/pages" 2>&1 | tee "$OUT/pages.log"
          exit "${PIPESTATUS[0]}"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: out-${{ matrix.engine }}-${{ matrix.id }}
          path: ${{ runner.temp }}/out
          retention-days: 14

  browser-full:
    name: ${{ matrix.engine }} ${{ matrix.id }}
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ${{ matrix.engine == 'webkit' && 'macos-26' || 'ubuntu-24.04' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: webkit, id: foundation-docs-spike-split-pages-dark, only: "foundation,docs,spike,split", themes: dark, pages: true }
          - { engine: webkit, id: g2a-g5-dark, only: "g2,g5", k: '^(g2\.[a-d]|g5\.)', themes: dark }
          - { engine: webkit, id: g2b-dark, only: g2, k: '^g2\.[e-z]', themes: dark }
          - { engine: webkit, id: g1-g3a-dark, only: "g1,g3", k: '^(g1\.|g3\.[a-c])', themes: dark }
          - { engine: webkit, id: g3b-g4-dark, only: "g3,g4", k: '^(g3\.[d-z]|g4\.)', themes: dark }
          - { engine: chromium, id: rtl-g2a-spike, only: "g2,spike", k: '^(g2\.[a-n]|spike\.)', themes: light, mode: rtl }
          - { engine: chromium, id: rtl-g2b-g5, only: "g2,g5", k: '^(g2\.[o-z]|g5\.)', themes: light, mode: rtl }
          - { engine: chromium, id: rtl-foundation-g1-docs, only: "foundation,g1,docs", themes: light, mode: rtl }
          - { engine: chromium, id: rtl-g3-g4, only: "g3,g4", themes: light, mode: rtl }
          - { engine: chromium, id: reduced-motion-g2a-spike, only: "g2,spike", k: '^(g2\.[a-n]|spike\.)', themes: light, mode: reduced-motion }
          - { engine: chromium, id: reduced-motion-g2b-g5, only: "g2,g5", k: '^(g2\.[o-z]|g5\.)', themes: light, mode: reduced-motion }
          - { engine: chromium, id: reduced-motion-foundation-g1-docs, only: "foundation,g1,docs", themes: light, mode: reduced-motion }
          - { engine: chromium, id: reduced-motion-g3-g4, only: "g3,g4", themes: light, mode: reduced-motion }
          - { engine: chromium, id: min-foundation-docs, only: "foundation,docs", kit: min }
          - { engine: chromium, id: min-g1, only: g1, kit: min }
          - { engine: chromium, id: min-g2a, only: g2, k: '^g2\.[a-d]', kit: min }
          - { engine: chromium, id: min-g2b-g5, only: "g2,g5", k: '^(g2\.[e-n]|g5\.)', kit: min }
          - { engine: chromium, id: min-g2c, only: g2, k: '^g2\.[o-s]', kit: min }
          - { engine: chromium, id: min-g2d-g4a, only: "g2,g4", k: '^(g2\.[t-z]|g4\.[a-c])', kit: min }
          - { engine: chromium, id: min-g3a-spike, only: "g3,spike", k: '^(g3\.[a-c]|spike\.)', kit: min }
          - { engine: chromium, id: min-g3b, only: g3, k: '^g3\.[d-z]', kit: min }
          - { engine: chromium, id: min-g4b, only: g4, k: '^g4\.[d-z]', kit: min }
    env:
      ENGINE: ${{ matrix.engine }}
      ONLY: ${{ matrix.only }}
      K: ${{ matrix.k }}
      THEMES: ${{ matrix.themes || 'light,dark' }}
      MODE: ${{ matrix.mode }}
      KIT: ${{ matrix.kit }}
    steps: *browser-steps

  ci-result:
    name: ci-result
    if: always()
    needs: [go, gitleaks, browser, browser-full]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          RESULTS: ${{ needs.go.result }} ${{ needs.gitleaks.result }} ${{ needs.browser.result }}
          FULL: ${{ needs.browser-full.result }}
        run: |
          echo "$RESULTS $FULL"
          for r in $RESULTS; do
            [ "$r" = success ] || exit 1
          done
          [ "$FULL" = success ] || [ "$FULL" = skipped ]
